<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, maximum-scale=1.0, user-scalable=no">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"Microsoft JhengHei",sans-serif;
  background:#111;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:15px 0 75px;
  gap:15px;
}

/* 遊戲板 */
.board{
  width:95%;
  aspect-ratio:2/3;
  background:url("https://aiwe.cc/wp-content/uploads/2025/11/ece235adf24ce45191df6de0c0ba86e5.gif") center/contain no-repeat;
  background-color:#000;
  border-radius:10px;
  position:relative;
  overflow:hidden;
}

/* 玩家 */
.player{
  position:absolute;
  width:80px;
  height:85px;
  transition:all .4s ease-in-out;
  z-index:10;
}
.player img{width:100%;height:100%;object-fit:contain;}
@keyframes walk{0%,100%{transform:rotate(0);}25%{transform:rotate(-4deg);}75%{transform:rotate(4deg);}}
.walking{animation:walk .45s infinite ease-in-out;}

/* 中央控制區 */
.center{
  position:absolute;
  top:65%;
  left:50%;
  transform:translate(-50%,-50%);
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:15px;
  z-index:5;
}

.dice-box{
  display:flex;
  gap:25px;
}

.roll-btn{
  padding:15px 30px;
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:white;
  font-size:20px;
  font-weight:bold;
  border:none;
  border-radius:25px;
  box-shadow:0 4px 10px rgba(0,0,0,.3);
  cursor:pointer;
  transition:all 0.3s ease;
}

.msg{
  color:#000;
  font-size:14px;
  font-weight:bold;
  text-shadow:1px 1px 2px rgba(255,255,255,.6);
  min-height:18px;
  transition:opacity .5s ease;
}

/* ========== 3D 骰子樣式 ========== */
/* 3D 場景容器 */
.dice-scene {
  width: 52px;
  height: 52px;
  perspective: 600px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* 3D 骰子容器 */
.dice {
  width: 52px;
  height: 52px;
  position: relative;
  transform-style: preserve-3d;
  /* 🎯 關鍵修正：移除 transition，避免與動畫衝突 */
  transform: rotateX(0deg) rotateY(0deg);
}

/* 骰子的每一面 */
.dice-face {
  width: 52px;
  height: 52px;
  background: linear-gradient(145deg, #ffffff, #f0f0f0);
  border-radius: 8px;
  position: absolute;
  box-shadow: 
    inset 0 0 10px rgba(0,0,0,0.1),
    0 2px 8px rgba(0,0,0,0.15);
}

/* 骰子點數 */
.dot {
  width: 8px;
  height: 8px;
  background: #333;
  border-radius: 50%;
  position: absolute;
  box-shadow: inset 0 2px 3px rgba(0,0,0,0.3);
}

/* 6個面的3D位置 */
.dice-face.front  { transform: rotateY(0deg)   translateZ(26px); }
.dice-face.back   { transform: rotateY(180deg) translateZ(26px); }
.dice-face.right  { transform: rotateY(90deg)  translateZ(26px); }
.dice-face.left   { transform: rotateY(-90deg) translateZ(26px); }
.dice-face.top    { transform: rotateX(90deg)  translateZ(26px); }
.dice-face.bottom { transform: rotateX(-90deg) translateZ(26px); }

/* 1點 - 中央紅色 */
.face-1 .dot {
  background: #d32f2f;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}

/* 2點 - 對角線 */
.face-2 .dot:nth-child(1) {
  top: 25%;
  left: 25%;
}
.face-2 .dot:nth-child(2) {
  bottom: 25%;
  right: 25%;
}

/* 3點 - 正三角對角線 */
.face-3 .dot:nth-child(1) {
  top: 25%;
  left: 25%;
}
.face-3 .dot:nth-child(2) {
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
.face-3 .dot:nth-child(3) {
  bottom: 25%;
  right: 25%;
}

/* 4點 - 四個角落 */
.face-4 .dot:nth-child(1) {
  top: 25%;
  left: 25%;
}
.face-4 .dot:nth-child(2) {
  top: 25%;
  right: 25%;
}
.face-4 .dot:nth-child(3) {
  bottom: 25%;
  left: 25%;
}
.face-4 .dot:nth-child(4) {
  bottom: 25%;
  right: 25%;
}

/* 5點 - 四角+中央 */
.face-5 .dot:nth-child(1) {
  top: 25%;
  left: 25%;
}
.face-5 .dot:nth-child(2) {
  top: 25%;
  right: 25%;
}
.face-5 .dot:nth-child(3) {
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
.face-5 .dot:nth-child(4) {
  bottom: 25%;
  left: 25%;
}
.face-5 .dot:nth-child(5) {
  bottom: 25%;
  right: 25%;
}

/* 6點 - 左右兩列 */
.face-6 .dot:nth-child(1) {
  top: 25%;
  left: 30%;
}
.face-6 .dot:nth-child(2) {
  top: 50%;
  left: 30%;
  transform: translateY(-50%);
}
.face-6 .dot:nth-child(3) {
  bottom: 25%;
  left: 30%;
}
.face-6 .dot:nth-child(4) {
  top: 25%;
  right: 30%;
}
.face-6 .dot:nth-child(5) {
  top: 50%;
  right: 30%;
  transform: translateY(-50%);
}
.face-6 .dot:nth-child(6) {
  bottom: 25%;
  right: 30%;
}

/* 🎯 修正：調整投擲動畫 */
.dice.rolling {
  animation: roll 1.1s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  transition: none;
}

@keyframes roll {
  0% { 
    transform: rotateX(0deg) rotateY(0deg) translateY(-50px);
  }
  15% {
    transform: rotateX(180deg) rotateY(90deg) translateY(0px);
  }
  25% {
    transform: rotateX(270deg) rotateY(135deg) translateY(-25px);
  }
  35% {
    transform: rotateX(360deg) rotateY(180deg) translateY(0px);
  }
  50% { 
    transform: rotateX(540deg) rotateY(270deg) translateY(0px);
  }
  75% {
    transform: rotateX(630deg) rotateY(315deg) translateY(0px);
  }
  /* 🎯 關鍵修正：明確結束在0度 */
  100% { 
    transform: rotateX(0deg) rotateY(0deg) translateY(0px);
  }
}

.roll-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 15px rgba(0,0,0,.4);}
.roll-btn:active:not(:disabled){transform:translateY(0);}
.roll-btn:disabled{opacity:0.6;cursor:not-allowed;}

/* 底部功能區 */
.bottom-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:60px;
  background:#FFF8E1;
  display:flex;
  justify-content:space-around;
  align-items:center;

.bottom-bar button{

  background:transparent;
  color:#333;
  font-size:10px;
  font-weight:bold;
  cursor:pointer;
  transition:all .3s ease;
  display:flex;

.bottom-bar button:active{background:rgba(0,0,0,0.1);}
.bottom-bar button .icon{font-size:20px;color:#333;}

/* LINE 頭像 */
.line-avatar{

#lineLoginBtn.has-avatar .line-avatar{display:block;}

/* 登入頁面 */
.login-screen{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);

.login-screen.hidden{display:none;}
.login-box{

  max-width:450px;width:100%;

@keyframes slideIn{
  from{opacity:0;transform:translateY(-30px);}
  to{opacity:1;transform:translateY(0);}
}
.login-box .logo{font-size:80px;margin-bottom:20px;animation:bounce 1s infinite ease-in-out;}
@keyframes bounce{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-10px);}
}
.login-box h1{font-size:36px;color:#333;margin-bottom:15px;}
.login-box p{font-size:18px;color:#666;margin-bottom:40px;line-height:1.6;}
.login-box .line-login-btn{
  width:100%;padding:20px;
  background:#06C755;color:white;
  border:none;border-radius:15px;
  font-size:24px;font-weight:bold;
  cursor:pointer;transition:all 0.3s ease;
  display:flex;align-items:center;justify-content:center;
  gap:15px;box-shadow:0 8px 20px rgba(6,199,85,0.3);
}
.login-box .line-login-btn:hover{background:#05b04b;transform:translateY(-2px);box-shadow:0 12px 30px rgba(6,199,85,0.4);}
.login-box .line-login-btn .icon{font-size:32px;}

.shop-popup{
  position:fixed;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%) scale(0.75); /* 🎯 整體縮小 */
  width:85%;
  max-width:280px; /* 可視需求再略小 */

  border-radius:12px;
  box-shadow:0 6px 20px rgba(0,0,0,.35);
  overflow:hidden;
  z-index:50;
  display:none;
  animation:fadeIn .4s ease;
  transform-origin:center center; /* 確保縮放中心不偏移 */
}

@keyframes fadeIn{
  from{opacity:0;transform:translate(-50%,-45%);}
  to{opacity:1;transform:translate(-50%,-50%);}
}

.shop-hero{
  width:100%;
  height:0;
  padding-bottom:65%;
  position:relative;
  overflow:hidden;
}
.shop-hero img{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;

}

.shop-body{padding:16px;background:white;}
.shop-title{font-size:18px;font-weight:bold;color:#333;margin-bottom:8px;line-height:1.3;}
.shop-desc{font-size:13px;color:#666;line-height:1.5;}
.desc-line{margin-bottom:4px;display:block;}

.shop-footer{padding:0 16px 16px;background:white;}
.shop-buttons{display:flex;flex-direction:column;gap:8px;}
.shop-buttons button{

  font-weight:bold;
  cursor:pointer;

.shop-buttons button:active{transform:scale(0.98);}
.shop-buttons .claim{background:#764ba2;}
.shop-buttons .close{background:#888;}
</style>

<body>

<script>
// 🎮 遊戲核心變數與設定
const player = document.getElementById('player');
const board = document.getElementById('board');
const msg = document.getElementById('msg');
const dice1 = document.getElementById('dice1');
const dice2 = document.getElementById('dice2');
const rollBtn = document.getElementById('rollBtn');
const bgm = document.getElementById('bgm');
const sDice = document.getElementById('sDice');
const sMove = document.getElementById('sMove');
const couponSound = document.getElementById('couponSound'); // 🎵 新增優惠券音效
const shopPopup = document.getElementById('shopPopup');
const shopImg = document.getElementById('shopImg');
const shopName = document.getElementById('shopName');
const shopDesc = document.getElementById('shopDesc');
const claimBtn = document.getElementById('claimBtn');

let currentShop = null;
const rows = 9, cols = 6;
let pos = 0;

// 遊戲路徑設定
const path = [];
for (let x = cols - 1; x >= 0; x--) path.push({ x, y: rows - 1 });
for (let y = rows - 2; y >= 0; y--) path.push({ x: 0, y });
for (let x = 1; x < cols; x++) path.push({ x, y: 0 });
for (let y = 1; y < rows - 1; y++) path.push({ x: cols - 1, y });

// 🎯 修正：每個面對應的旋轉角度
const rotations = {
  1: 'rotateX(0deg) rotateY(0deg)',      // 正面 (front)
  2: 'rotateX(90deg) rotateY(0deg)',     // 底面 (bottom) - 修正
  3: 'rotateX(0deg) rotateY(-90deg)',    // 右側面 (right)
  4: 'rotateX(0deg) rotateY(90deg)',     // 左側面 (left)
  5: 'rotateX(-90deg) rotateY(0deg)',    // 頂面 (top) - 修正
  6: 'rotateX(0deg) rotateY(180deg)'     // 背面 (back)
};

// ============================================
// 🎮 遊戲核心功能
// ============================================
function startGame() {
  if (bgm.paused) {
    bgm.volume = 0.3;
    bgm.play().catch(() => {});
  }
  rollDice();
}

function updatePlayer() {
  const cell = path[pos];
  const w = board.clientWidth / cols;
  const h = board.clientHeight / rows;
  let offsetX = 0;
  
  if (cell.y === rows - 1) offsetX = -w * 0.05;
  else if (cell.y === 0) offsetX = w * 0.05;
  
  if (cell.x === cols - 1 && cell.y > 0 && cell.y < rows - 1) offsetX -= w * 0.27;
  
  player.style.left = `${cell.x * w + w / 2 - player.clientWidth / 2 + offsetX}px`;
  player.style.top = `${cell.y * h + h / 2 - player.clientHeight / 2}px`;
}

// ✨ 🎯 v3.1 - 最終完美版本（邏輯+視覺都100%正確）
async function rollDice() {
  console.log('🎲 === 開始投擲骰子 ===');
  
  rollBtn.disabled = true;
  rollBtn.textContent = '🎲 投擲中...';
  
  // 隨機生成點數（先決定結果）
  const v1 = Math.floor(Math.random() * 6) + 1;
  const v2 = Math.floor(Math.random() * 6) + 1;
  
  console.log(`   骰子1: ${v1} 點`);
  console.log(`   骰子2: ${v2} 點`);
  console.log(`   總計: ${v1 + v2} 點`);
  
  // 播放音效
  sDice.currentTime = 0;
  sDice.play();
  
  // 創建Promise等待兩個骰子動畫都結束
  const waitForAnimations = new Promise((resolve) => {
    let dice1Done = false;
    let dice2Done = false;
    
    const checkBothDone = () => {
      if (dice1Done && dice2Done) {
        resolve();
      }
    };
    
    // 監聽骰子1動畫結束
    const onDice1End = () => {
      dice1Done = true;
      dice1.removeEventListener('animationend', onDice1End);
      console.log('✅ 骰子1動畫結束');
      checkBothDone();
    };
    
    // 監聽骰子2動畫結束
    const onDice2End = () => {
      dice2Done = true;
      dice2.removeEventListener('animationend', onDice2End);
      console.log('✅ 骰子2動畫結束');
      checkBothDone();
    };
    
    dice1.addEventListener('animationend', onDice1End);
    dice2.addEventListener('animationend', onDice2End);
  });
  
  // 🎯 重置為0度
  dice1.style.transition = 'none';
  dice2.style.transition = 'none';
  dice1.style.transform = 'rotateX(0deg) rotateY(0deg)';
  dice2.style.transform = 'rotateX(0deg) rotateY(0deg)';
  
  // 強制重繪
  void dice1.offsetWidth;
  void dice2.offsetWidth;
  
  // 添加動畫
  dice1.classList.add('rolling');
  dice2.classList.add('rolling');
  console.log('🎬 動畫開始');
  
  // 等待動畫真正結束
  await waitForAnimations;
  
  console.log('🎯 動畫結束，準備設置最終角度');
  
  // 移除動畫類別
  dice1.classList.remove('rolling');
  dice2.classList.remove('rolling');
  
  // 🎯 關鍵：確保無過渡，直接設置
  dice1.style.transition = 'none';
  dice2.style.transition = 'none';
  
  // 強制重繪
  void dice1.offsetWidth;
  void dice2.offsetWidth;
  
  // 立即設置最終角度
  dice1.style.transform = rotations[v1];
  dice2.style.transform = rotations[v2];
  console.log(`🎯 已設置最終角度: dice1=${v1} (${rotations[v1]}), dice2=${v2} (${rotations[v2]})`);
  
  // 短暫延遲確保渲染完成
  await new Promise(r => setTimeout(r, 100));
  
  // 停止音效並顯示結果
  sDice.pause();
  
  const total = v1 + v2;
  showMsg(`🎲 擲出 ${v1} + ${v2} = ${total} 點！`);
  rollBtn.textContent = '🎲 投擲骰子';
  
  // 最終確認角度
  console.log(`✅ 最終確認: 骰子1=${v1}, 骰子2=${v2}`);
  console.log(`   骰子1當前transform: ${dice1.style.transform}`);
  console.log(`   骰子2當前transform: ${dice2.style.transform}`);
  
  console.log('✅ 骰子停止，開始移動玩家');
  movePlayer(total);
}

async function movePlayer(steps) {
  console.log(`🚶 開始移動玩家 ${steps} 步...`);
  
  player.classList.add('walking');
  sMove.loop = true;
  sMove.currentTime = 0;
  sMove.play().catch(() => {});
  
  for (let i = 0; i < steps; i++) {
    pos = (pos + 1) % path.length;
    updatePlayer();
    await new Promise(r => setTimeout(r, 450));
  }
  
  player.classList.remove('walking');
  sMove.pause();
  sMove.currentTime = 0;
  
  console.log(`✅ 玩家移動完成，當前位置: ${pos}`);
  console.log('🔍 準備檢查格子事件...');
  
  await checkEvent();
  
  console.log('✅ 格子事件檢查完成');
  
  setTimeout(() => hideMsg(), 800);
  rollBtn.disabled = false;
}

// ============================================
// 🏪 格子事件處理系統
// ============================================
async function checkEvent() {
  try {
    console.log(`🎯 檢查格子 ${pos} 的事件...`);
    
    // 讀取當前格子的配置
    const cellConfig = await getCellConfig(pos);
    
    if (!cellConfig) {
      console.warn(`⚠️ 找不到格子 ${pos} 的配置`);
      showMsg('格子配置錯誤');
      return;
    }
    
    console.log(`📍 格子 ${pos} 配置:`, cellConfig);
    const cellType = cellConfig.格子類型;
    console.log(`   格子類型: ${cellType}`);
    
    // 根據格子類型執行不同邏輯
    switch (cellType) {
      case '店家':
        console.log('🏪 這是店家格子，準備顯示店家...');
        await handleShopCell(cellConfig);
        break;
        
      case '獎勵':
        console.log('🎉 這是獎勵格子');
        await handleRewardCell(cellConfig);
        break;
        
      case '懲罰':
        console.log('💥 這是懲罰格子');
        await handlePenaltyCell(cellConfig);
        break;
        
      case '機會':
        console.log('🎲 這是機會格子');
        await handleChanceCell(cellConfig);
        break;
        
      case '起點':
        console.log('🏁 回到起點');
        showMsg('🏁 回到起點！');
        break;
        
      default:
        console.log(`❓ 未知格子類型: ${cellType}`);
        showMsg(`踩到 ${cellConfig.格子名稱}`);
    }
    
  } catch (error) {
    console.error('❌ 處理格子事件時發生錯誤:', error);
    console.error('錯誤堆疊:', error.stack);
    showMsg('格子事件執行失敗');
  }
}

// 處理店家格
async function handleShopCell(cellConfig) {
  console.log('🏪 === 開始處理店家格 ===');
  console.log('   收到的配置:', cellConfig);
  
  const category = cellConfig.店家分類;
  console.log('   店家分類:', category);
  
  if (!category || category === '-') {
    console.warn('⚠️ 此格子沒有有效的店家分類');
    showMsg('此格子沒有店家');
    return;
  }
  
  console.log(`🔍 尋找分類「${category}」的店家...`);
  
  try {
    // 從店家資料篩選該分類
    const shops = await loadShopsByCategory(category);
    console.log(`📊 找到 ${shops.length} 個店家:`, shops);
    
    if (shops.length === 0) {
      console.warn(`⚠️ 分類「${category}」沒有店家資料`);
      showMsg(`找不到「${category}」類型的店家`);
      return;
    }
    
    // 隨機選一間店家
    const randomIndex = Math.floor(Math.random() * shops.length);
    const randomShop = shops[randomIndex];
    console.log(`🎲 隨機選擇第 ${randomIndex} 個店家:`, randomShop);
    
    // 確保店家資料包含所有必要欄位
    currentShop = {
      "店家名稱": randomShop["店家名稱"] || randomShop.name || "店家",
      "優惠內容": randomShop["優惠內容"] || randomShop.discount || "優惠",
      "圖片網址": randomShop["圖片網址"] || randomShop.imageUrl || randomShop.icon || "",
      
      // 🎯 關鍵修正：使用「加LINE 建模」作為主要欄位名稱
      "加LINE連繫": randomShop["加LINE 建模"] || randomShop["加LINE連繫"] || randomShop.lineUrl || "",
      "地址": randomShop["地址"] || randomShop.addressUrl || "",
      
      "店家分類": randomShop["店家分類"] || category
    };

    console.log('🔍 加LINE 建模欄位內容:', randomShop["加LINE 建模"]);
    console.log('🔍 地址欄位內容:', randomShop["地址"]);
    console.log('✅ 處理後的店家資料:', currentShop);
    
    // 🎵 播放抽到優惠券音效
    playCouponSound();
    showShopPopup(currentShop);
    
  } catch (error) {
    console.error('❌ 處理店家格時發生錯誤:', error);
    showMsg('載入店家資料失敗');
  }
}

// 🎵 新增：播放優惠券音效函數
function playCouponSound() {
    try {
        couponSound.currentTime = 0;
        couponSound.volume = 0.7;
        couponSound.play().catch(e => console.log('音效播放失敗:', e));
    } catch (error) {
        console.log('播放優惠券音效時發生錯誤:', error);
    }
}

// 處理獎勵格
async function handleRewardCell(cellConfig) {
  const event = cellConfig.特殊事件;
  const param = cellConfig.事件參數;
  
  if (event === '前進' && param) {
    showMsg(`🎉 ${cellConfig.格子名稱}！前進 ${param} 步！`);
    player.classList.add('walking');
    sMove.loop = true;
    sMove.currentTime = 0;
    sMove.play().catch(() => {});
    
    for (let i = 0; i < param; i++) {
      pos = (pos + 1) % path.length;
      updatePlayer();
      await new Promise(r => setTimeout(r, 450));
    }
    
    player.classList.remove('walking');
    sMove.pause();
    sMove.currentTime = 0;
    
  } else if (event === '再擲一次') {
    showMsg(`🎊 ${cellConfig.格子名稱}！再擲一次骰子！`);
    setTimeout(() => {
      rollBtn.disabled = false;
      rollBtn.click();
    }, 1500);
  } else {
    showMsg(`⭐ ${cellConfig.格子名稱}！`);
  }
}

// 處理懲罰格
async function handlePenaltyCell(cellConfig) {
  const event = cellConfig.特殊事件;
  const param = cellConfig.事件參數;
  
  if (event === '後退' && param) {
    showMsg(`💥 ${cellConfig.格子名稱}！退回 ${param} 步！`);
    player.classList.add('walking');
    sMove.loop = true;
    sMove.currentTime = 0;
    sMove.play().catch(() => {});
    
    for (let i = 0; i < param; i++) {
      pos = (pos - 1 + path.length) % path.length;
      updatePlayer();
      await new Promise(r => setTimeout(r, 300));
    }
    
    player.classList.remove('walking');
    sMove.pause();
    sMove.currentTime = 0;
  } else {
    showMsg(`⚠️ ${cellConfig.格子名稱}！`);
  }
}

// 處理機會格
async function handleChanceCell(cellConfig) {
  showMsg(`🎲 ${cellConfig.格子名稱}！抽取機會卡...`);
  
  await new Promise(r => setTimeout(r, 1000));
  
  const isGoodLuck = Math.random() < 0.5;
  
  if (isGoodLuck) {
    const goodEvents = [
      { msg: '🎁 好運！獲得 2 張隨機優惠券！', action: async () => {
        const shops = await loadShops();
        if (shops.length >= 2) {
          const shop1 = shops[Math.floor(Math.random() * shops.length)];
          const shop2 = shops[Math.floor(Math.random() * shops.length)];
          // 🎵 播放抽到優惠券音效
          playCouponSound();
          await saveCoupon(shop1);
          await saveCoupon(shop2);
        }
      }},
      { msg: '✨ 好運！傳送到起點！', action: async () => {
        pos = 0;
        updatePlayer();
      }},
      { msg: '🚀 好運！前進 5 步！', action: async () => {
        player.classList.add('walking');
        sMove.loop = true;
        sMove.play().catch(() => {});
        for (let i = 0; i < 5; i++) {
          pos = (pos + 1) % path.length;
          updatePlayer();
          await new Promise(r => setTimeout(r, 450));
        }
        player.classList.remove('walking');
        sMove.pause();
      }}
    ];
    
    const event = goodEvents[Math.floor(Math.random() * goodEvents.length)];
    showMsg(event.msg);
    await event.action();
    
  } else {
    const badEvents = [
      { msg: '😱 壞運！暫停一回合！', action: async () => {
        rollBtn.disabled = true;
        setTimeout(() => { rollBtn.disabled = false; }, 3000);
      }},
      { msg: '⬅️ 壞運！後退 5 步！', action: async () => {
        player.classList.add('walking');
        sMove.loop = true;
        sMove.play().catch(() => {});
        for (let i = 0; i < 5; i++) {
          pos = (pos - 1 + path.length) % path.length;
          updatePlayer();
          await new Promise(r => setTimeout(r, 300));
        }
        player.classList.remove('walking');
        sMove.pause();
      }}
    ];
    
    const event = badEvents[Math.floor(Math.random() * badEvents.length)];
    showMsg(event.msg);
    await event.action();
  }
}

function showShopPopup(shop) {
  console.log('📱 === showShopPopup 被調用 ===');
  
  const imgUrl = shop["圖片網址"] || shop.icon || shop.imageUrl || "";
  const shopNameText = shop["店家名稱"] || shop.name || shop.shopName || "神秘店家";
  let shopDescText = shop["優惠內容"] || shop.discount || shop.description || "限時優惠，趕快來看看！";
  
  // 處理換行
  shopDescText = shopDescText.replace(/。/g, '。<br>');
  
  // 圖片設置
  if (imgUrl && (imgUrl.startsWith("http://") || imgUrl.startsWith("https://"))) {
    shopImg.src = imgUrl;
    shopImg.onerror = function() {
      this.src = "https://developers-resource.landpress.line.me/fx/img/01_1_cafe.png";
    };
  } else {
    shopImg.src = "https://developers-resource.landpress.line.me/fx/img/01_1_cafe.png";
  }
  
  shopName.textContent = shopNameText;
  
  // ✅ 前端彈窗：只顯示優惠內容，不顯示加LINE連繫和地址
  shopDesc.innerHTML = shopDescText;
  
  shopPopup.style.display = 'block';
  claimBtn.disabled = false;
  claimBtn.textContent = "收藏優惠";
  
  console.log('✅ 店家彈窗已顯示');
}

function closeShop() {
  shopPopup.style.display = 'none';
}

// ============================================
// 🎫 收藏按鈕事件
// ============================================
claimBtn.addEventListener('click', async () => {
  if (!currentShop) return;
  
  console.log('📦 準備收藏的店家資料:', currentShop);
  
  claimBtn.disabled = true;
  claimBtn.textContent = "🎉 收藏中...";
  
  try {
    const success = await saveCoupon(currentShop);
    
    if (success) {
      claimBtn.textContent = "✅ 收藏成功！";
      console.log('✅ 優惠券已成功保存');
      setTimeout(() => {
        closeShop();
      }, 1500);
    } else {
      claimBtn.textContent = "⚠️ 收藏失敗";
      setTimeout(() => {
        claimBtn.textContent = "收藏優惠";
        claimBtn.disabled = false;
      }, 2000);
    }
    
  } catch (error) {
    console.error('❌ 收藏錯誤:', error);
    claimBtn.textContent = "⚠️ 網路錯誤";
    setTimeout(() => {
      claimBtn.textContent = "收藏優惠";
      claimBtn.disabled = false;
    }, 2000);
  }
});

// ============================================
// 📱 頁面載入初始化
// ============================================
window.addEventListener('DOMContentLoaded', async function() {
  console.log('=== 📱 初始化應用程式 ===');
  console.log('🎲 3D 骰子系統已啟用！');
  
  if (typeof initializeApp === 'undefined') {
    console.error('❌ common.js 未載入！');
    alert('系統初始化失敗：找不到 common.js');
    return;
  }
  
  // 🎯 初始化骰子顯示為1點
  dice1.style.transform = rotations[1];
  dice2.style.transform = rotations[1];
  console.log('✅ 骰子已初始化為1點');
  
  await initializeApp();
  updatePlayer();
  
  console.log('✅ 應用程式初始化完成');
  console.log('📍 當前位置:', pos);
  console.log('🎮 準備開始遊戲！');
});

// 訊息顯示函數
function showMsg(text) {
  msg.textContent = text;
  msg.style.opacity = 1;
}

function hideMsg() {
  msg.style.opacity = 0;
}


// 🎯 修正：登出並重新登入功能
function logoutAndReLogin() {
  console.log('🚪 執行登出並重新登入...');
  
  // 清除本地儲存的用戶資料
  localStorage.removeItem('lineUserId');
  localStorage.removeItem('lineDisplayName');
  localStorage.removeItem('linePictureUrl');
  localStorage.removeItem('lineLoginTime');
  
  sessionStorage.removeItem('lineUserId');
  sessionStorage.removeItem('lineDisplayName');
  sessionStorage.removeItem('linePictureUrl');
  sessionStorage.removeItem('justLoggedIn');
  
  // 顯示登入畫面
  document.getElementById('loginScreen').classList.remove('hidden');
  
  // 重置底部按鈕狀態
  const lineLoginBtn = document.getElementById('lineLoginBtn');
  const lineAvatar = document.getElementById('lineAvatar');
  const lineLoginText = document.getElementById('lineLoginText');
  
  lineLoginBtn.classList.remove('has-avatar');
  lineAvatar.src = '';
  lineLoginText.textContent = 'LINE';
  
  console.log('✅ 已登出，準備重新登入');
  showMsg('請重新登入');
}
