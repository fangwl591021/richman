<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>店家進駐申請｜v4.1</title>
    <!-- 版本號：v4.1 -->
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --success: #22c55e;
            --bg: #f8f9fa;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Microsoft JhengHei', sans-serif;
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 480px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: var(--secondary);
            margin-bottom: 8px;
            font-size: 24px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            text-align: center;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .form-group { margin-bottom: 20px; }
        
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            color: #444;
            font-size: 15px;
        }

        input, select, textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #edf2f7;
            border-radius: 12px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #fdfdfd;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        /* Emoji 選擇器樣式 */
        .emoji-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 15px;
            margin-top: 10px;
            max-height: 160px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
        }

        .emoji-item {
            font-size: 24px;
            cursor: pointer;
            text-align: center;
            transition: transform 0.2s;
            padding: 5px;
            border-radius: 8px;
        }

        .emoji-item:hover {
            transform: scale(1.3);
            background: white;
        }

        .emoji-item.selected {
            background: #e2e8f0;
            transform: scale(1.1);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(118, 75, 162, 0.3);
            margin-top: 10px;
        }

        .btn-submit:active { transform: scale(0.98); }
        .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

        /* 成功畫面 */
        #successArea {
            display: none;
            text-align: center;
            padding: 20px 0;
        }

        .success-icon {
            font-size: 60px;
            color: var(--success);
            margin-bottom: 20px;
        }

        .footer-note {
            text-align: center;
            font-size: 12px;
            color: #aaa;
            margin-top: 25px;
        }
    </style>
</head>
<body>
    <div class="container" id="formArea">
        <h1>🏬 店家進駐申請</h1>
        <p class="subtitle">歡迎加入大富翁商圈！<br>填寫資料經核准後，您的店家將正式上架。</p>
        
        <form id="applyForm">
            <div class="form-group">
                <label>店家名稱 *</label>
                <input type="text" id="shopName" placeholder="例如：幸運咖啡杯" required>
            </div>
            
            <div class="form-group">
                <label>服務分類 *</label>
                <select id="shopCategory" required>
                    <option value="">請選擇分類</option>
                    <option value="美食">美食餐飲</option>
                    <option value="咖啡">咖啡茶飲</option>
                    <option value="零售">零售百貨</option>
                    <option value="生活">生活休閒</option>
                    <option value="其他">其他服務</option>
                </select>
            </div>

            <div class="form-group">
                <label>選擇地圖圖示 * <span id="displaySelected"></span></label>
                <input type="hidden" id="shopIcon" required>
                <div class="emoji-grid" id="emojiGrid">
                    <!-- JavaScript 會填充這裡 -->
                </div>
            </div>

            <div class="form-group">
                <label>優惠內容摘要 *</label>
                <input type="text" id="shopDiscount" placeholder="如：全品項九折、買二送一" required>
            </div>

            <div class="form-group">
                <label>店家地址/聯絡方式</label>
                <input type="text" id="shopAddress" placeholder="讓玩家找得到您的店">
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">送出進駐申請</button>
        </form>
        <p class="footer-note">Powered by Richman Monopoly System v4.1</p>
    </div>

    <div class="container" id="successArea">
        <div class="success-icon">✅</div>
        <h2>申請已送出！</h2>
        <p class="subtitle" style="margin-top:15px">
            感謝您的參與。管理員將在審核資料後與您聯繫，核准後店家將自動顯示在地圖中。
        </p>
        <button class="btn-submit" onclick="location.reload()" style="background: #f0f0f0; color: #555; box-shadow: none;">再填一份</button>
    </div>

    <script src="config.js?v=1.0"></script>
    <script>
        const RICHMAN_CONFIG = window.RICHMAN_CONFIG || {};
        const API_URL = RICHMAN_CONFIG.API_BASE || 'https://richman.fangwl591021.workers.dev/';

        // 初始化 Emoji 清單
        const emojis = ['☕','🍔','🍕','🍜','🍣','🍰','🛍️','🎁','🏠','🏢','🏥','🏦','⚽','👕','👗','💊','🧋','🧁','🥐','🎨','💄','💈','📖'];
        const grid = document.getElementById('emojiGrid');
        
        emojis.forEach(e => {
            const div = document.createElement('div');
            div.className = 'emoji-item';
            div.textContent = e;
            div.onclick = () => selectEmoji(e, div);
            grid.appendChild(div);
        });

        function selectEmoji(e, el) {
            document.getElementById('shopIcon').value = e;
            document.getElementById('displaySelected').textContent = '已選擇: ' + e;
            
            // 視覺效果切換
            document.querySelectorAll('.emoji-item').forEach(item => item.classList.remove('selected'));
            el.classList.add('selected');
        }

        // 提交邏輯
        document.getElementById('applyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const shopIcon = document.getElementById('shopIcon').value;
            if (!shopIcon) {
                alert('請選擇一個代表您的圖示！');
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = '正在傳送資料...';

            const data = {
                action: 'addShop',
                name: document.getElementById('shopName').value,
                category: document.getElementById('shopCategory').value,
                icon: shopIcon,
                discount: document.getElementById('shopDiscount').value,
                address: document.getElementById('shopAddress').value,
                status: '待核准', // 初始狀態
                couponCount: 100   // 預設優惠券數量
            };

            try {
                // 使用 FormData 以相容後端解析
                const formData = new FormData();
                for (const key in data) {
                    formData.append(key, data[key]);
                }

                const response = await fetch(API_URL, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                let res;
                try {
                    res = await response.json();
                } catch (parseError) {
                    throw new Error('後端回應格式錯誤，無法解析 JSON');
                }

                if (res.success) {
                    document.getElementById('formArea').style.display = 'none';
                    document.getElementById('successArea').style.display = 'block';
                } else {
                    alert('提交失敗：' + (res.message || '未知錯誤'));
                    btn.disabled = false;
                    btn.innerText = '重新送出申請';
                }
            } catch (err) {
                console.error(err);
                alert('提交失敗：' + (err.message || '網路連線失敗，請檢查您的網路或確認 Worker 是否正確執行。'));
                btn.disabled = false;
                btn.innerText = '重新送出申請';
            }
        });
    </script>
</body>
</html>
