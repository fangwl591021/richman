<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店家進駐申請 - 大富翁</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft JhengHei', sans-serif; background: #f8f9fa; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .form-card { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1 { color: #764ba2; margin-bottom: 10px; font-size: 24px; text-align: center; }
        p { color: #666; font-size: 14px; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #444; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; }
        .emoji-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; background: #f0f0f0; padding: 10px; border-radius: 10px; margin-top: 5px; }
        .emoji-item { font-size: 24px; cursor: pointer; text-align: center; }
        .btn-submit { width: 100%; padding: 15px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .success-msg { display: none; text-align: center; padding: 40px 0; }
        .success-msg h2 { color: #22c55e; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="form-card" id="formArea">
        <h1>🏬 申請成為遊戲店家</h1>
        <p>請填寫以下資訊，審核通過後將出現在大富翁地圖中！</p>
        
        <form id="applyForm">
            <div class="form-group">
                <label>店家名稱 *</label>
                <input type="text" id="shopName" placeholder="例如：快樂咖啡館" required>
            </div>
            
            <div class="form-group">
                <label>服務分類 *</label>
                <select id="shopCategory" required>
                    <option value="美食">美食餐飲</option>
                    <option value="咖啡">咖啡茶飲</option>
                    <option value="生活">生活休閒</option>
                    <option value="零售">零售百貨</option>
                </select>
            </div>

            <div class="form-group">
                <label>選擇一個代表圖示 *</label>
                <input type="text" id="shopIcon" readonly required style="background:#eee; margin-bottom:5px;">
                <div class="emoji-grid" id="emojiGrid"></div>
            </div>

            <div class="form-group">
                <label>提供的優惠內容 *</label>
                <input type="text" id="shopDiscount" placeholder="例如：全品項九折、買二送一" required>
            </div>

            <div class="form-group">
                <label>店家地址</label>
                <input type="text" id="shopAddress" placeholder="讓玩家找得到您">
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">提交申請</button>
        </form>
    </div>

    <div class="form-card success-msg" id="successArea">
        <h2>🎉 申請已送出！</h2>
        <p>管理員將在 1-3 個工作天內完成審核。<br>核准後您的店家就會正式上架，請留意遊戲公告。</p>
        <button class="btn-submit" onclick="location.reload()">再填一份</button>
    </div>

    <script>
        const API_URL = 'https://richman.fangwl591021.workers.dev/';

        // Emoji 選擇
        const emojis = ['☕','🍔','🍕','🍜','🍱','🍣','🛍️','🎁','🏠','🏢','🏥','🏦','⚽','👕','👗','💊','🧋','🧁'];
        const grid = document.getElementById('emojiGrid');
        grid.innerHTML = emojis.map(e => `<div class="emoji-item" onclick="selectEmoji('${e}')">${e}</div>`).join('');

        function selectEmoji(e) {
            document.getElementById('shopIcon').value = e;
        }

        // 表單提交
        document.getElementById('applyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = '處理中...';

            const data = {
                action: 'addShop',
                name: document.getElementById('shopName').value,
                category: document.getElementById('shopCategory').value,
                icon: document.getElementById('shopIcon').value,
                discount: document.getElementById('shopDiscount').value,
                address: document.getElementById('shopAddress').value,
                status: '待核准' // 關鍵：預設狀態
            };

            try {
                const formData = new FormData();
                for (const key in data) formData.append(key, data[key]);

                const response = await fetch(API_URL, { method: 'POST', body: formData });
                const res = await response.json();

                if (res.success) {
                    document.getElementById('formArea').style.display = 'none';
                    document.getElementById('successArea').style.display = 'block';
                } else {
                    alert('提交失敗：' + res.message);
                }
            } catch (err) {
                alert('系統連線錯誤，請稍後再試');
            } finally {
                btn.disabled = false;
                btn.innerText = '提交申請';
            }
        });
    </script>
</body>
</html>
