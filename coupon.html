<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{
  font-family:"Microsoft JhengHei",sans-serif;
  background:#f5f5f5;
  min-height:100vh;
  padding-bottom:70px;
}

/* 頁面標題 */
.page-header{
  background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  color:white;
  padding:20px 15px;
  text-align:center;
}
.page-header h1{
  font-size:24px;
  margin-bottom:5px;
}
.page-header .subtitle{
  font-size:14px;
  opacity:0.9;
}

/* 優惠券列表 */
.coupon-list{
  padding:15px;
  display:grid;
  gap:12px;
}
.coupon-card{
  background:white;
  border-radius:12px;
  padding:15px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
  display:flex;
  gap:12px;
  position:relative;
  transition:all 0.3s ease;
}
.coupon-card.inactive{
  background:#f9f9f9;
  opacity:0.7;
}
.coupon-card img{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:8px;
  flex-shrink:0;
}
.coupon-card-info{
  flex:1;
}
.coupon-card-info h3{
  font-size:16px;
  margin-bottom:6px;
  color:#333;
}
.coupon-card-info .discount{
  color:#e53935;
  font-weight:bold;
  line-height:1.4;
  font-size:14px;
  margin-bottom:6px;
}
.coupon-card-info .date{
  font-size:12px;
  color:#999;
  margin-bottom:8px;
}
.coupon-card-info .status{
  font-size:12px;
  font-weight:bold;
  padding:4px 10px;
  border-radius:20px;
  display:inline-block;
}
.coupon-card-info .status.available{
  color:#4caf50;
  background:#e8f5e8;
}
.coupon-card-info .status.used{
  color:#999;
  background:#f0f0f0;
}
.coupon-card-info .status.abandoned{
  color:#ff9800;
  background:#fff3e0;
  border:1px solid #ffb74d;
}
.coupon-actions{
  display:flex;
  gap:8px;
  margin-top:10px;
  flex-wrap:wrap;
}
.coupon-actions button{
  padding:8px 12px;
  border:none;
  border-radius:6px;
  font-size:12px;
  font-weight:bold;
  cursor:pointer;
  transition:all 0.2s ease;
  display:flex;
  align-items:center;
  gap:4px;
  flex:1;
  min-width:80px;
  justify-content:center;
}
.coupon-actions .verify-btn{
  background:#4caf50;
  color:white;
}
.coupon-actions .verify-btn:active{
  background:#45a049;
  transform:scale(0.95);
}
.coupon-actions .verify-btn:disabled{
  background:#cccccc;
  cursor:not-allowed;
  transform:none;
}
.coupon-actions .abandon-btn{
  background:#ff9800;
  color:white;
}
.coupon-actions .abandon-btn:active{
  background:#f57c00;
  transform:scale(0.95);
}
.coupon-actions .abandon-btn:disabled{
  background:#cccccc;
  cursor:not-allowed;
  transform:none;
}
/* 新增的按鈕樣式 */
.coupon-actions .line-btn{
  background:#06C755;
  color:white;
}
.coupon-actions .line-btn:active{
  background:#05b04b;
  transform:scale(0.95);
}
.coupon-actions .map-btn{
  background:#2196F3;
  color:white;
}
.coupon-actions .map-btn:active{
  background:#1976D2;
  transform:scale(0.95);
}
/* 確保按鈕禁用狀態明顯 */
.coupon-actions button:disabled{
  opacity:0.6;
  cursor:not-allowed;
  transform:none !important;
}

/* 分隔線 */
.section-divider{
  padding:10px 15px;
  font-size:14px;
  color:#666;
  font-weight:bold;
  border-bottom:1px solid #eee;
  margin:10px 0;
  background:#f9f9f9;
}

/* 空狀態 */
.empty-state{
  text-align:center;
  padding:60px 20px;
  color:#999;
}
.empty-state .icon{
  font-size:48px;
  margin-bottom:15px;
}
.empty-state p{
  font-size:16px;
  line-height:1.5;
}
.empty-state .action-btn{
  margin-top:20px;
  padding:12px 24px;
  background:#764ba2;
  color:white;
  border:none;
  border-radius:25px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

/* 底部導航 */
.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:60px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid #eee;
  z-index:100;
}
.bottom-nav button{
  flex:1;
  height:100%;
  border:none;
  background:transparent;
  color:#333;
  font-size:10px;
  font-weight:bold;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
}
.bottom-nav button.active{
  color:#764ba2;
}
.bottom-nav button .icon{
  font-size:20px;
}

/* LINE 頭像 */
.line-avatar{
  width:30px;
  height:30px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #fff;
  box-shadow:0 2px 6px rgba(0,0,0,0.3);
}
#lineLoginBtn.has-avatar .icon{
  display:none;
}
#lineLoginBtn.has-avatar .line-avatar{
  display:block;
}
#lineLoginBtn .line-avatar{
  display:none;
}
.bottom-nav button.logged-in{
  color:#5D4037;
}

/* 載入狀態 */
.loading{
  text-align:center;
  padding:40px;
  color:#999;
}
</style>
</head>
<body>

<!-- 頁面標題 -->
<div class="page-header">
  <h1>我的優惠券</h1>
  <div class="subtitle">收集的店家優惠都在這裡</div>
</div>

<!-- 優惠券列表 -->
<div class="coupon-list" id="couponList">
  <div class="loading">載入中...</div>
</div>

<!-- 底部導航 -->
<div class="bottom-nav">
  <button onclick="window.location.href='index.html'">
    <span class="icon">🎲</span>
    <span>遊戲</span>
  </button>
  
  <button class="active">
    <span class="icon">🎫</span>
    <span>優惠券</span>
  </button>
  
  <button onclick="window.location.href='https://aiwe.cc/index.php/linecard_12/1460/?share=1'">
    <span class="icon">🗺️</span>
    <span>店家地圖</span>
  </button>
  
  <button id="lineLoginBtn" onclick="lineLogin()">
    <span class="icon">📱</span>
    <img class="line-avatar" id="lineAvatar" src="" alt="LINE">
    <span id="lineLoginText">LINE</span>
  </button>
</div>

<script>
// 頁面載入時初始化
window.addEventListener('DOMContentLoaded', async function() {
  await initializeApp();
  loadCouponList();
});

// 取得當前用戶資訊
function getCurrentUser() {
  const lineUserId = localStorage.getItem('lineUserId');
  if (lineUserId) {
    return {
      userId: lineUserId,
      displayName: localStorage.getItem('lineDisplayName'),
      pictureUrl: localStorage.getItem('linePictureUrl')
    };
  }
  return null;
}

// 格式化優惠內容 - 句號換行
function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"]/g, char => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;'
  }[char]));
}

function escapeInlineJsString(value) {
  return escapeHtml(String(value ?? '')
    .replace(/\\/g, '\\\\')
    .replace(/'/g, '\\x27')
    .replace(/[\r\n]+/g, ' '));
}

function safeImageUrl(value) {
  const url = String(value || '').trim();
  return /^https?:\/\//i.test(url) ? escapeHtml(url) : 'https://developers-resource.landpress.line.me/fx/img/01_1_cafe.png';
}

function formatCouponDescription(text) {
  if (!text) return '暫無優惠說明';
  return escapeHtml(text).replace(/。/g, '。<br>');
}

// 合併本地狀態到優惠券資料
function mergeLocalCouponStatus(coupons) {
  const usedCoupons = JSON.parse(localStorage.getItem('usedCoupons') || '{}');
  
  return coupons.map(coupon => {
    const couponId = coupon.couponId || coupon.id;
    if (couponId && usedCoupons[couponId]) {
      // 如果本地有狀態記錄，覆蓋後端的狀態
      return {
        ...coupon,
        used: usedCoupons[couponId].used
      };
    }
    return coupon;
  });
}

// 優化的 loadCouponList 函數
async function loadCouponList() {
  const couponList = document.getElementById('couponList');
  
  try {
    let coupons = await loadCoupons();
    
    // 添加除錯資訊
    console.log('📋 完整的優惠券資料:', coupons);
    console.log('🔍 詳細的 F 和 G 欄位檢查:', coupons.map(c => ({
      店家名稱: c["店家名稱"],
      F: c["F"],
      G: c["G"],
      F類型: typeof c["F"],
      G類型: typeof c["G"],
      F是否為空: !c["F"],
      G是否為空: !c["G"]
    })));
    
    // 合併本地狀態
    coupons = mergeLocalCouponStatus(coupons);
    
    if (coupons.length > 0) {
      // 分組：未使用、已使用、已放棄
      const availableCoupons = coupons.filter(coupon => {
        const used = coupon.used;
        const isAvailable = !(used === true || used === 'TRUE' || used === 'true' || used === 'abandoned' || used === '已使用');
        return isAvailable;
      });
      
      const usedCoupons = coupons.filter(coupon => {
        const used = coupon.used;
        return used === true || used === 'TRUE' || used === 'true' || used === '已使用';
      });
      
      const abandonedCoupons = coupons.filter(coupon => 
        coupon.used === 'abandoned'
      );
      
      let html = '';
      
      // 未使用的優惠券
      if (availableCoupons.length > 0) {
        html += '<div class="section-divider">可使用優惠券</div>';
        html += availableCoupons.map(coupon => createCouponHTML(coupon)).join('');
      }
      
      // 已使用的優惠券
      if (usedCoupons.length > 0) {
        html += '<div class="section-divider">已使用優惠券</div>';
        html += usedCoupons.map(coupon => createCouponHTML(coupon)).join('');
      }
      
      // 已放棄的優惠券
      if (abandonedCoupons.length > 0) {
        html += '<div class="section-divider">已放棄優惠券</div>';
        html += abandonedCoupons.map(coupon => createCouponHTML(coupon)).join('');
      }
      
      couponList.innerHTML = html;
      
      // 檢查生成的 HTML 中是否包含按鈕
      console.log('🔄 生成的 HTML 結構檢查:');
      const tempDiv = document.createElement('div');
      tempDiv.innerHTML = html;
      const lineButtons = tempDiv.querySelectorAll('.line-btn');
      const mapButtons = tempDiv.querySelectorAll('.map-btn');
      console.log(`✅ 找到 ${lineButtons.length} 個 LINE 按鈕`);
      console.log(`✅ 找到 ${mapButtons.length} 個地圖按鈕`);
      
    } else {
      couponList.innerHTML = `
        <div class="empty-state">
          <div class="icon">🎫</div>
          <p>還沒有收集任何優惠券<br>快去遊戲中收集吧！</p>
          <button class="action-btn" onclick="window.location.href='index.html'">
            開始遊戲
          </button>
        </div>
      `;
    }
  } catch (error) {
    console.error('載入優惠券失敗:', error);
    couponList.innerHTML = `
      <div class="empty-state">
        <div class="icon">⚠️</div>
        <p>載入失敗，請稍後再試</p>
      </div>
    `;
  }
}

// 在 coupon.html 中修改 createCouponHTML 函數
function createCouponHTML(coupon) {
  const shopName = coupon["店家名稱"] || coupon.shopName || coupon.name || '店家名稱';
  const shopNameText = escapeHtml(shopName);
  const discountText = formatCouponDescription(coupon["優惠內容"] || coupon.discount || coupon.description || '優惠內容');
  const imageUrl = safeImageUrl(coupon["圖片網址"] || coupon.imageUrl || coupon.icon);
  
  const lineContact = coupon["加LINE連繫"] || coupon["F"] || coupon.lineContact || coupon.lineUrl || '';
  const address = coupon["地址"] || coupon["G"] || coupon.address || coupon.mapUrl || '';
  
  console.log('🔍 測試按鈕狀態', shopName, { lineContact, address });  // ← 這一行
  console.log(`🎫 優惠券 ${shopName} 的聯繫資訊:`, {
    lineContact,
    address,
    hasLine: !!lineContact,
    hasMap: !!address
  });

  
  // 其餘程式碼保持不變...
  // 狀態判斷
  const usedValue = coupon.used;
  const isUsed = usedValue === true || 
                usedValue === 'TRUE' || 
                usedValue === 'true' ||
                usedValue === '已使用';
  
  const isAbandoned = usedValue === 'abandoned';
  
  let statusClass = 'available';
  let statusText = '可使用';
  
  if (isUsed) {
    statusClass = 'used';
    statusText = '已使用';
  } else if (isAbandoned) {
    statusClass = 'abandoned';
    statusText = '已放棄';
  }
  
  const couponId = coupon.couponId || coupon.id || `temp_${Date.now()}`;
  const couponIdArg = escapeInlineJsString(couponId);
  const couponIdAttr = escapeHtml(couponId);
  const lineContactArg = escapeHtml(encodeURIComponent(lineContact));
  const addressArg = escapeHtml(encodeURIComponent(address));
  const shopNameArg = escapeHtml(encodeURIComponent(shopName));
  
  return `
  <div class="coupon-card ${isUsed || isAbandoned ? 'inactive' : ''}" data-coupon-id="${couponIdAttr}">
    <img src="${imageUrl}" 
         onerror="this.src='https://developers-resource.landpress.line.me/fx/img/01_1_cafe.png'">
    <div class="coupon-card-info">
      <h3>${shopNameText}</h3>
      <div class="discount">${discountText}</div>
      <div class="date">
        ${coupon.obtainedDate ? new Date(coupon.obtainedDate).toLocaleDateString('zh-TW') : '今天'}
      </div>
      <div class="status ${statusClass}">${statusText}</div>
      
      <div class="coupon-actions">
        ${!isUsed && !isAbandoned ? `
        <button class="verify-btn" onclick="handleVerifyCoupon('${couponIdArg}')">
          <span>✓</span>核銷
        </button>
        <button class="abandon-btn" onclick="handleAbandonCoupon('${couponIdArg}')">
          <span>🗑️</span>放棄
        </button>
        ` : ''}
        
        <!-- 加LINE按鈕 -->
        <button class="line-btn" onclick="handleLineContact('${couponIdArg}', '${lineContactArg}', '${shopNameArg}')" ${!lineContact ? 'disabled' : ''}>
          <span>💚</span>加LINE
        </button>
        
        <!-- 地圖按鈕 -->
        <button class="map-btn" onclick="handleOpenMap('${couponIdArg}', '${addressArg}', '${shopNameArg}')" ${!address ? 'disabled' : ''}>
          <span>🗺️</span>地圖
        </button>
      </div>
    </div>
  </div>
  `;
}

// 在 coupon.html 中優化連結處理函數
function handleLineContact(couponId, encodedLineContact, encodedShopName) {
  try {
    const lineContact = decodeURIComponent(encodedLineContact);
    const shopName = decodeURIComponent(encodedShopName);
    
    console.log(`💚 開啟 LINE 聯繫: ${shopName}`, lineContact);
    
    if (!lineContact) {
      alert('此店家暫無 LINE 聯繫資訊');
      return;
    }
    
    let lineUrl = '';
    
    // 判斷聯繫方式類型並生成正確的連結
    if (lineContact.startsWith('http://') || lineContact.startsWith('https://')) {
      // 已經是完整 URL
      lineUrl = lineContact;
    } else if (lineContact.startsWith('@')) {
      // LINE 官方帳號 (@開頭)
      lineUrl = `https://line.me/R/ti/p/${lineContact.substring(1)}`;
    } else if (lineContact.includes('line.me')) {
      // 包含 line.me 的連結
      lineUrl = lineContact;
    } else {
      // 可能是 LINE ID，使用添加好友連結
      lineUrl = `https://line.me/R/ti/p/${lineContact}`;
    }
    
    console.log(`🔗 生成的 LINE 連結: ${lineUrl}`);
    window.open(lineUrl, '_blank');
    
  } catch (error) {
    console.error('❌ 開啟 LINE 聯繫錯誤:', error);
    alert('開啟 LINE 聯繫失敗，請稍後再試');
  }
}

function handleOpenMap(couponId, encodedAddress, encodedShopName) {
  try {
    const address = decodeURIComponent(encodedAddress);
    const shopName = decodeURIComponent(encodedShopName);
    
    console.log(`🗺️ 開啟地圖: ${shopName}`, address);
    
    if (!address) {
      alert('此店家暫無地圖資訊');
      return;
    }
    
    let mapUrl = '';
    
    // 判斷地址類型並生成正確的地圖連結
    if (address.startsWith('http://') || address.startsWith('https://')) {
      // 已經是完整 URL（可能是 Google Maps 或其他地圖連結）
      mapUrl = address;
    } else if (address.includes('map') || address.includes('maps')) {
      // 包含地圖關鍵字但可能不完整
      if (!address.startsWith('http')) {
        mapUrl = 'https://' + address;
      } else {
        mapUrl = address;
      }
    } else {
      // 純文字地址，使用 Google Maps 搜尋
      mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(address)}`;
    }
    
    console.log(`🔗 生成的地圖連結: ${mapUrl}`);
    window.open(mapUrl, '_blank');
    
  } catch (error) {
    console.error('❌ 開啟地圖錯誤:', error);
    alert('開啟地圖失敗，請稍後再試');
  }
}

// 處理開啟地圖
function handleOpenMap(couponId, encodedMapUrl, encodedShopName) {
  try {
    const mapUrl = decodeURIComponent(encodedMapUrl);
    const shopName = decodeURIComponent(encodedShopName);
    
    console.log(`🗺️ 開啟地圖: ${shopName}`, mapUrl);
    
    if (!mapUrl) {
      alert('此店家暫無地圖資訊');
      return;
    }
    
    // 檢查是否為有效的 URL
    if (mapUrl.startsWith('http://') || mapUrl.startsWith('https://')) {
      // 在新視窗開啟地圖連結
      window.open(mapUrl, '_blank');
    } else {
      // 如果不是完整 URL，可能是地址，使用 Google Maps 搜尋
      const googleMapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(mapUrl)}`;
      window.open(googleMapsUrl, '_blank');
    }
    
  } catch (error) {
    console.error('❌ 開啟地圖錯誤:', error);
    alert('開啟地圖失敗，請稍後再試');
  }
}

// 輔助函數：根據 couponId 找到對應的優惠券卡片
function findCouponCardById(couponId) {
  // 方法1: 通過 data attribute 查找
  const safeCouponId = window.CSS && CSS.escape
    ? CSS.escape(couponId)
    : String(couponId).replace(/[^a-zA-Z0-9_-]/g, '\\$&');
  const cardByDataAttr = document.querySelector(`[data-coupon-id="${safeCouponId}"]`);
  if (cardByDataAttr) return cardByDataAttr;
  
  // 方法2: 通過按鈕的 onclick 內容查找
  const couponCards = document.querySelectorAll('.coupon-card');
  for (let card of couponCards) {
    const buttons = card.querySelectorAll('button');
    for (let button of buttons) {
      if (button.getAttribute('onclick') && button.getAttribute('onclick').includes(couponId)) {
        return card;
      }
    }
  }
  return null;
}

// 核銷處理函數 - 立即更新版本
async function handleVerifyCoupon(couponId) {
  try {
    console.log('🎫 開始核銷優惠券:', couponId);
    
    const confirmed = confirm('確定要核銷這張優惠券嗎？核銷後將無法復原。');
    if (!confirmed) return;
    
    // 找到對應的優惠券卡片並立即禁用按鈕
    const couponCard = findCouponCardById(couponId);
    if (couponCard) {
      const buttons = couponCard.querySelectorAll('button');
      buttons.forEach(btn => {
        btn.disabled = true;
        btn.style.opacity = '0.6';
      });
    }
    
    const success = await verifyCoupon(couponId);
    
    if (success) {
      // 立即重新載入列表
      await loadCouponList();
      alert('優惠券已成功核銷！');
      window.scrollTo(0, 0);
    } else {
      alert('核銷失敗，請稍後再試');
      // 重新啟用按鈕
      if (couponCard) {
        const buttons = couponCard.querySelectorAll('button');
        buttons.forEach(btn => {
          btn.disabled = false;
          btn.style.opacity = '1';
        });
      }

// 放棄優惠券 API 呼叫
async function abandonCoupon(couponId) {
  try {
    const user = getCurrentUser();
    if (!user || !user.userId) {
      throw new Error('用戶未登入');
    }
    
    const formData = new FormData();
    formData.append('action', 'abandonCoupon');
    formData.append('userId', user.userId);
    formData.append('couponId', couponId);
    
    const response = await fetch((window.RICHMAN_CONFIG && window.RICHMAN_CONFIG.API_BASE) || 'https://richman.fangwl591021.workers.dev/', {
      method: 'POST',
      body: formData
    });
    
    const result = await response.json();
    console.log('放棄回應:', result);
    
    if (result.success === true || result.status === 'success') {
      console.log('✅ 放棄成功！');
      
      // 更新本地狀態
      let usedCoupons = JSON.parse(localStorage.getItem('usedCoupons') || '{}');
      usedCoupons[couponId] = {
        used: 'abandoned',
        abandonedAt: new Date().toISOString()
      };
      localStorage.setItem('usedCoupons', JSON.stringify(usedCoupons));
      
      return true;
    } else {
      throw new Error(result.message || '放棄失敗');
    }
    
  } catch (error) {
    console.error('❌ 放棄錯誤:', error);
    return false;
  }
}
