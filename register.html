<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>註冊資料 - 歡樂大富翁</title>
    <!-- 載入 common.js -->
    <script src="config.js?v=1.0"></script>
    <script src="common.js?v=2.1"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .register-box {
            background: white;
            border-radius: 30px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
        }
        .logo {
            font-size: 60px;
            margin-bottom: 15px;
        }
        h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        .user-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #06C755;
        }
        .user-details {
            text-align: left;
            flex: 1;
        }
        .user-name {
            font-weight: bold;
            font-size: 18px;
            color: #333;
        }
        .user-id {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        select, input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: "Microsoft JhengHei", sans-serif;
        }
        select:focus, input:focus {
            border-color: #06C755;
            outline: none;
        }
        .register-btn {
            width: 100%;
            padding: 20px;
            background: #06C755;
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
        }
        .register-btn:hover:not(:disabled) {
            background: #05a848;
            transform: translateY(-2px);
        }
        .register-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
            line-height: 1.5;
        }
        .error { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
        .success { background: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
        .info { background: #e3f2fd; color: #1976d2; border: 1px solid #bbdefb; }
        .loading { background: #fff3e0; color: #ef6c00; border: 1px solid #ffe0b2; }
        
        /* 響應式設計 */
        @media (max-width: 480px) {
            .register-box {
                padding: 30px 20px;
                margin: 10px;
            }
            .logo {
                font-size: 50px;
            }
            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="register-box">
        <div class="logo">🎲</div>
        <h1>歡迎加入歡樂大富翁！</h1>
        <p class="subtitle">請填寫基本資料完成註冊</p>
        
        <div class="user-info" id="userInfo">
            <!-- 用戶資訊會由 JavaScript 動態填入 -->
        </div>
        
        <form id="registerForm">
            <div class="form-group">
                <label for="nickname">遊戲暱稱</label>
                <input type="text" id="nickname" placeholder="請輸入您的遊戲暱稱" required maxlength="20">
                <small style="color: #666; font-size: 12px; margin-top: 5px; display: block;">
                    最多 20 個字元
                </small>
            </div>
            
            <div class="form-group">
                <label for="county">選擇地區</label>
                <select id="county" required>
                    <option value="">請選擇縣市</option>
                    <option value="台北市">台北市</option>
                    <option value="新北市">新北市</option>
                    <option value="桃園市">桃園市</option>
                    <option value="台中市">台中市</option>
                    <option value="台南市">台南市</option>
                    <option value="高雄市">高雄市</option>
                    <option value="基隆市">基隆市</option>
                    <option value="新竹市">新竹市</option>
                    <option value="嘉義市">嘉義市</option>
                    <option value="新竹縣">新竹縣</option>
                    <option value="苗栗縣">苗栗縣</option>
                    <option value="彰化縣">彰化縣</option>
                    <option value="南投縣">南投縣</option>
                    <option value="雲林縣">雲林縣</option>
                    <option value="嘉義縣">嘉義縣</option>
                    <option value="屏東縣">屏東縣</option>
                    <option value="宜蘭縣">宜蘭縣</option>
                    <option value="花蓮縣">花蓮縣</option>
                    <option value="台東縣">台東縣</option>
                    <option value="澎湖縣">澎湖縣</option>
                    <option value="金門縣">金門縣</option>
                    <option value="連江縣">連江縣</option>
                </select>
            </div>
            
            <button type="submit" class="register-btn" id="registerBtn">
                完成註冊
            </button>
        </form>
        
        <div id="status"></div>
    </div>

    <script>
    // DOM 元素
    const userInfoDiv = document.getElementById('userInfo');
    const registerForm = document.getElementById('registerForm');
    const registerBtn = document.getElementById('registerBtn');
    const statusDiv = document.getElementById('status');

    // 顯示狀態訊息
    function showStatus(message, type = 'info') {
        statusDiv.textContent = message;
        statusDiv.className = `status ${type}`;
        console.log(`📢 ${type}: ${message}`);
    }

    // 檢查是否已註冊
    function checkExistingRegistration(userId) {
        try {
            const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers') || '{}');
            if (registeredUsers[userId] && registeredUsers[userId].registered) {
                showStatus('您已經註冊過了！即將進入遊戲...', 'info');
                registerBtn.disabled = true;
                registerBtn.textContent = '已註冊';
                
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
                return true;
            }
        } catch (error) {
            console.error('檢查註冊狀態失敗:', error);
        }
        return false;
    }

    // 檢查用戶資料完整性
    function validateUserData() {
        const userId = localStorage.getItem('lineUserId');
        const displayName = localStorage.getItem('lineDisplayName');
        
        if (!userId) {
            throw new Error('未找到用戶ID');
        }
        if (!displayName) {
            throw new Error('未找到用戶名稱');
        }
        
        return { userId, displayName };
    }

    // 建立用戶資料結構
    function createUserData(nickname, county, baseData) {
        return {
            // LINE 基本資料
            lineUserId: baseData.userId,
            lineDisplayName: baseData.displayName,
            linePictureUrl: localStorage.getItem('linePictureUrl') || '',
            
            // 註冊資料
            nickname: nickname,
            county: county,
            
            // 遊戲資料
            level: 1,
            coins: 1000,
            experience: 0,
            currentPosition: 0,
            
            // 資產與收藏
            coupons: [],
            ownedProperties: [],
            visitedShops: [],
            
            // 統計資料
            totalRolls: 0,
            totalSteps: 0,
            gamesPlayed: 0,
            
            // 時間戳記
            registrationTime: new Date().toISOString(),
            lastLoginTime: new Date().toISOString(),
            updatedAt: new Date().toISOString()
        };
    }

    // 保存用戶資料到本地
    function saveUserDataToLocal(userData) {
        try {
            // 1. 保存到 userProfile
            localStorage.setItem('userProfile', JSON.stringify(userData));
            
            // 2. 記錄到已註冊用戶列表
            const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers') || '{}');
            registeredUsers[userData.lineUserId] = {
                registered: true,
                nickname: userData.nickname,
                county: userData.county,
                registrationTime: userData.registrationTime,
                timestamp: new Date().toISOString(),
                localOnly: true
            };
            localStorage.setItem('registeredUsers', JSON.stringify(registeredUsers));
            
            // 3. 設置註冊完成標記
            sessionStorage.setItem('registrationComplete', 'true');
            sessionStorage.setItem('userRegistered', 'true');
            
            return true;
        } catch (error) {
            console.error('保存用戶資料失敗:', error);
            throw new Error('資料保存失敗: ' + error.message);
        }
    }

    // 驗證資料保存
    function verifyDataSave(userId) {
        const savedProfile = localStorage.getItem('userProfile');
        const savedRegisteredUsers = localStorage.getItem('registeredUsers');
        
        if (!savedProfile) {
            throw new Error('userProfile 保存失敗');
        }
        if (!savedRegisteredUsers) {
            throw new Error('registeredUsers 保存失敗');
        }
        
        try {
            const profile = JSON.parse(savedProfile);
            const registeredUsers = JSON.parse(savedRegisteredUsers);
            
            if (profile.lineUserId !== userId) {
                throw new Error('用戶ID不匹配');
            }
            if (!registeredUsers[userId] || !registeredUsers[userId].registered) {
                throw new Error('註冊記錄不完整');
            }
            
            return true;
        } catch (error) {
            throw new Error('資料驗證失敗: ' + error.message);
        }
    }

    // 頁面載入初始化
    window.addEventListener('DOMContentLoaded', function() {
        console.log('🚀 註冊頁面初始化開始');
        
        try {
            // 驗證用戶資料
            const { userId, displayName } = validateUserData();
            const pictureUrl = localStorage.getItem('linePictureUrl');

            console.log('🔍 載入用戶資料:', { userId, displayName });

            // 顯示用戶資訊
            userInfoDiv.innerHTML = `
                <img src="${pictureUrl || 'https://via.placeholder.com/60x60?text=頭像'}" 
                     alt="用戶頭像" class="user-avatar"
                     onerror="this.src='https://via.placeholder.com/60x60?text=頭像'">
                <div class="user-details">
                    <div class="user-name">${displayName}</div>
                    <div class="user-id">ID: ${userId.substring(0, 8)}...</div>
                </div>
            `;

            // 自動填入建議的暱稱
            document.getElementById('nickname').value = displayName;

            // 檢查是否已經註冊過
            if (checkExistingRegistration(userId)) {
                return;
            }

            // 檢查是否有未完成的註冊資料
            const userProfileStr = localStorage.getItem('userProfile');
            if (userProfileStr) {
                try {
                    const userProfile = JSON.parse(userProfileStr);
                    if (userProfile.lineUserId === userId) {
                        // 有未完成的註冊資料，自動填入
                        if (userProfile.nickname) {
                            document.getElementById('nickname').value = userProfile.nickname;
                        }
                        if (userProfile.county) {
                            document.getElementById('county').value = userProfile.county;
                        }
                        showStatus('發現未完成的註冊資料，已自動填入', 'info');
                    }
                } catch (error) {
                    console.error('解析用戶資料失敗:', error);
                }
            }

            console.log('✅ 註冊頁面初始化完成');

        } catch (error) {
            console.error('❌ 頁面初始化失敗:', error);
            showStatus(`初始化錯誤: ${error.message}`, 'error');
            registerBtn.disabled = true;
            
            setTimeout(() => {
                window.location.href = 'login.html';
            }, 3000);
        }
    });

    // 表單提交處理
    registerForm.addEventListener('submit', async function(e) {
        e.preventDefault();
        
        console.log('📝 表單提交開始');
        
        const nickname = document.getElementById('nickname').value.trim();
        const county = document.getElementById('county').value;

        // 基本驗證
        if (!nickname) {
            showStatus('請輸入遊戲暱稱', 'error');
            document.getElementById('nickname').focus();
            return;
        }
        
        if (nickname.length > 20) {
            showStatus('暱稱長度不能超過 20 個字元', 'error');
            document.getElementById('nickname').focus();
            return;
        }
        
        if (!county) {
            showStatus('請選擇地區', 'error');
            document.getElementById('county').focus();
            return;
        }

        try {
            // 禁用按鈕並顯示載入狀態
            registerBtn.disabled = true;
            registerBtn.textContent = '註冊中...';
            showStatus('註冊資料處理中，請稍候...', 'loading');

            // 驗證用戶資料
            const baseData = validateUserData();
            
            // 建立用戶資料
            const userData = createUserData(nickname, county, baseData);
            console.log('💾 建立用戶資料:', userData);

            // 保存到本地儲存
            saveUserDataToLocal(userData);
            
            // 驗證保存結果
            verifyDataSave(baseData.userId);
            
            console.log('✅ 本地註冊完成');

            // 嘗試調用 common.js 的後端註冊（如果可用）
            let backendResult = { success: false, message: 'common.js 未載入' };
            if (typeof completeRegistration === 'function') {
                showStatus('正在連接後端伺服器...', 'info');
                try {
                    backendResult = await completeRegistration(userData);
                    console.log('🌐 後端註冊結果:', backendResult);
                } catch (backendError) {
                    console.warn('後端註冊失敗:', backendError);
                    backendResult = { 
                        success: false, 
                        message: '後端註冊失敗，但本地註冊已完成' 
                    };
                }
            }

            // 顯示最終結果
            if (backendResult.success) {
                showStatus('🎉 註冊成功！即將進入遊戲...', 'success');
                registerBtn.textContent = '✅ 註冊成功';
            } else {
                showStatus('✅ 本地註冊完成！' + (backendResult.message ? ` (${backendResult.message})` : ''), 'success');
                registerBtn.textContent = '✅ 本地註冊完成';
            }

            // 跳轉到遊戲主頁面
            setTimeout(() => {
                console.log('🔄 跳轉到遊戲主頁面');
                window.location.href = 'index.html';
            }, 2000);

        } catch (error) {
            console.error('❌ 註冊失敗:', error);
            showStatus(`註冊失敗: ${error.message}`, 'error');
            
            // 恢復按鈕狀態
            registerBtn.disabled = false;
            registerBtn.textContent = '完成註冊';
        }
    });

    // 輸入框實時驗證
    document.getElementById('nickname').addEventListener('input', function(e) {
        const value = e.target.value.trim();
        if (value.length > 20) {
            e.target.value = value.substring(0, 20);
            showStatus('暱稱長度不能超過 20 個字元', 'error');
        }
    });

    // 防止表單重複提交
    let isSubmitting = false;
    registerForm.addEventListener('submit', function(e) {
        if (isSubmitting) {
            e.preventDefault();
            return;
        }
        isSubmitting = true;
        
        // 3秒後重置提交狀態（防止卡住）
        setTimeout(() => {
            isSubmitting = false;
        }, 3000);
    });

    console.log('📄 註冊頁面腳本載入完成');
    </script>
</body>
</html>
