<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINE 登入 - 歡樂大富翁</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-box {
            background: white;
            border-radius: 30px;
            padding: 50px 40px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
        }
        .logo {
            font-size: 80px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 36px;
            color: #333;
            margin-bottom: 15px;
        }
        h2 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }
        p {
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
            line-height: 1.6;
        }
        .line-login-btn {
            width: 100%;
            padding: 20px;
            background: #06C755;
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            transition: background 0.3s;
        }
        .line-login-btn:hover:not(:disabled) {
            background: #05b049;
        }
        .line-login-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            font-size: 16px;
        }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e9; color: #2e7d32; }
        .info { background: #e3f2fd; color: #1976d2; }
        
        /* ✅ 新增：補充資料表單樣式 */
        #profileForm {
            display: none;
            text-align: left;
            margin-top: 30px;
        }
        #profileForm.show {
            display: block;
        }
        .welcome-text {
            text-align: center;
            font-size: 20px;
            color: #333;
            margin-bottom: 10px;
        }
        .welcome-name {
            color: #667eea;
            font-weight: bold;
        }
        .form-intro {
            text-align: center;
            font-size: 16px;
            color: #666;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-label {
            display: block;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 12px;
        }
        .radio-group {
            display: flex;
            justify-content: space-around;
            gap: 10px;
        }
        .radio-option {
            flex: 1;
        }
        .radio-option input[type="radio"] {
            display: none;
        }
        .radio-option label {
            display: block;
            padding: 15px;
            background: #f5f5f5;
            border: 2px solid #ddd;
            border-radius: 12px;
            text-align: center;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .radio-option input[type="radio"]:checked + label {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .radio-option label:hover {
            border-color: #667eea;
        }
        select {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 12px;
            background: white;
            cursor: pointer;
            transition: border-color 0.3s;
        }
        select:focus {
            outline: none;
            border-color: #667eea;
        }
        select option {
            padding: 10px;
        }
        .start-game-btn {
            width: 100%;
            padding: 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 15px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
            transition: background 0.3s;
        }
        .start-game-btn:hover:not(:disabled) {
            background: #5568d3;
        }
        .start-game-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">🎲</div>
        <h1>歡樂大富翁</h1>
        <p id="loginDescription">歡迎來到最好買商圈！<br>請先使用 LINE 登入開始遊戲，<br>收集專屬優惠券吧！</p>
        
        <button class="line-login-btn" id="loginBtn" disabled>
            初始化中...
        </button>
        
        <div id="status"></div>

        <!-- ✅ 新增：補充資料表單 -->
        <div id="profileForm">
            <div class="welcome-text">
                歡迎，<span class="welcome-name" id="welcomeName"></span>！
            </div>
            <p class="form-intro">請完善您的個人資料</p>
            
            <!-- 性別選擇 -->
            <div class="form-group">
                <label class="form-label">👤 性別</label>
                <div class="radio-group">
                    <div class="radio-option">
                        <input type="radio" id="gender-male" name="gender" value="男">
                        <label for="gender-male">男</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="gender-female" name="gender" value="女">
                        <label for="gender-female">女</label>
                    </div>
                    <div class="radio-option">
                        <input type="radio" id="gender-other" name="gender" value="多元">
                        <label for="gender-other">多元</label>
                    </div>
                </div>
            </div>
            
            <!-- 居住地區選擇 -->
            <div class="form-group">
                <label class="form-label">📍 居住地區</label>
                <select id="countySelect" name="county">
                    <option value="">請選擇縣市</option>
                    <option value="基隆市">基隆市</option>
                    <option value="台北市">台北市</option>
                    <option value="新北市">新北市</option>
                    <option value="桃園市">桃園市</option>
                    <option value="新竹市">新竹市</option>
                    <option value="新竹縣">新竹縣</option>
                    <option value="苗栗縣">苗栗縣</option>
                    <option value="台中市">台中市</option>
                    <option value="彰化縣">彰化縣</option>
                    <option value="南投縣">南投縣</option>
                    <option value="雲林縣">雲林縣</option>
                    <option value="嘉義市">嘉義市</option>
                    <option value="嘉義縣">嘉義縣</option>
                    <option value="台南市">台南市</option>
                    <option value="高雄市">高雄市</option>
                    <option value="屏東縣">屏東縣</option>
                    <option value="宜蘭縣">宜蘭縣</option>
                    <option value="花蓮縣">花蓮縣</option>
                    <option value="台東縣">台東縣</option>
                    <option value="澎湖縣">澎湖縣</option>
                    <option value="金門縣">金門縣</option>
                    <option value="連江縣">連江縣</option>
                </select>
            </div>
            
            <!-- 開始遊戲按鈕 -->
            <button class="start-game-btn" id="startGameBtn" disabled>
                🎮 開始遊戲
            </button>
        </div>
    </div>

    <!-- LINE LIFF SDK -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="config.js?v=1.0"></script>
    
    <script>
    // ⚠️ 設定
    const RICHMAN_CONFIG = window.RICHMAN_CONFIG || {};
    const LIFF_ID = RICHMAN_CONFIG.LIFF_ID || '2008231249-7DlMkygo';
    const BACKEND_URL = RICHMAN_CONFIG.API_BASE || 'https://richman.fangwl591021.workers.dev/';
    
    const loginBtn = document.getElementById('loginBtn');
    const statusDiv = document.getElementById('status');
    const profileForm = document.getElementById('profileForm');
    const loginDescription = document.getElementById('loginDescription');
    const welcomeName = document.getElementById('welcomeName');
    const startGameBtn = document.getElementById('startGameBtn');
    const countySelect = document.getElementById('countySelect');
    const genderRadios = document.querySelectorAll('input[name="gender"]');
    
    let currentUserId = '';
    
    function showStatus(message, type = 'info') {
        statusDiv.textContent = message;
        statusDiv.className = `status ${type}`;
    }
    
    // ✅ 顯示補充資料表單
    function showProfileForm(displayName) {
        console.log('📝 顯示補充資料表單');
        
        // 隱藏登入按鈕和描述
        loginBtn.style.display = 'none';
        loginDescription.style.display = 'none';
        
        // 顯示表單
        welcomeName.textContent = displayName;
        profileForm.classList.add('show');
        
        // 監聽表單變化
        setupFormValidation();
    }
    
    // ✅ 表單驗證
    function setupFormValidation() {
        const validateForm = () => {
            const selectedGender = document.querySelector('input[name="gender"]:checked');
            const selectedCounty = countySelect.value;
            
            // 兩者都選了才啟用按鈕
            if (selectedGender && selectedCounty) {
                startGameBtn.disabled = false;
                console.log('✅ 表單已完整填寫');
            } else {
                startGameBtn.disabled = true;
            }
        };
        
        // 監聽性別選擇
        genderRadios.forEach(radio => {
            radio.addEventListener('change', validateForm);
        });
        
        // 監聽地區選擇
        countySelect.addEventListener('change', validateForm);
        
        // 監聽開始遊戲按鈕
        startGameBtn.addEventListener('click', submitProfile);
    }
    
    // ✅ 提交補充資料
    async function submitProfile() {
        try {
            const selectedGender = document.querySelector('input[name="gender"]:checked');
            const selectedCounty = countySelect.value;
            
            if (!selectedGender || !selectedCounty) {
                showStatus('請完整填寫性別和居住地區', 'error');
                return;
            }
            
            console.log('📤 提交補充資料:', {
                userId: currentUserId,
                gender: selectedGender.value,
                county: selectedCounty
            });
            
            showStatus('更新資料中...', 'info');
            startGameBtn.disabled = true;
            startGameBtn.textContent = '更新中...';
            
            // 呼叫 API 更新資料
            const formData = new FormData();
            formData.append('action', 'updateUserProfile');
            formData.append('userId', currentUserId);
            formData.append('gender', selectedGender.value);
            formData.append('county', selectedCounty);
            
            const response = await fetch(BACKEND_URL, {
                method: 'POST',
                body: formData
            });
            
            const result = await response.json();
            console.log('📊 更新回應:', result);
            
            if (result.success) {
                console.log('✅ 資料更新成功');
                showStatus('資料更新成功！正在進入遊戲...', 'success');
                
                // 等待一下再跳轉
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                console.log('🎮 跳轉到遊戲...');
                window.location.href = 'index.html';
            } else {
                throw new Error(result.message || '更新失敗');
            }
            
        } catch (error) {
            console.error('❌ 提交失敗:', error);
            showStatus('更新失敗: ' + error.message, 'error');
            startGameBtn.disabled = false;
            startGameBtn.textContent = '🎮 開始遊戲';
        }
    }
    
    // ✅ 檢查資料完整度
    async function checkProfileComplete(userId) {
        try {
            console.log('🔍 檢查資料完整度...');
            
            const response = await fetch(
                `${BACKEND_URL}?action=checkProfileComplete&userId=${encodeURIComponent(userId)}`
            );
            
            const result = await response.json();
            console.log('📊 完整度檢查結果:', result);
            
            return result;
            
        } catch (error) {
            console.error('❌ 檢查失敗:', error);
            // 發生錯誤時，假設資料不完整，顯示表單
            return { success: false, complete: false };
        }
    }
    
    // 初始化 LIFF
    async function init() {
        try {
            console.log('🚀 初始化 LIFF...');
            await liff.init({ liffId: LIFF_ID });
            console.log('✅ LIFF 初始化成功');
            
            if (liff.isLoggedIn()) {
                console.log('✅ 已登入，取得用戶資料');
                await getProfile();
            } else {
                console.log('ℹ️ 未登入');
                showStatus('請點擊下方按鈕登入', 'info');
                loginBtn.disabled = false;
                loginBtn.textContent = '📱 使用 LINE 登入';
                loginBtn.onclick = () => liff.login();
            }
            
        } catch (error) {
            console.error('❌ 初始化失敗:', error);
            showStatus('初始化失敗: ' + error.message, 'error');
            loginBtn.textContent = '❌ 初始化失敗';
        }
    }
    
    // 儲存用戶資料到後端
    async function saveUserToBackend(profile) {
        try {
            console.log('💾 儲存用戶資料到後端...');
            
            const formData = new FormData();
            formData.append('action', 'saveUserProfile');
            formData.append('userId', profile.userId);
            formData.append('displayName', profile.displayName);
            formData.append('pictureUrl', profile.pictureUrl || '');
            formData.append('statusMessage', profile.statusMessage || '');
            
            const response = await fetch(BACKEND_URL, {
                method: 'POST',
                body: formData
            });
            
            const result = await response.json();
            console.log('📊 後端回應:', result);
            
            if (result.success || result.status === 'success') {
                console.log('✅ 用戶資料已儲存到後端');
                return true;
            } else {
                console.warn('⚠️ 後端儲存失敗，但繼續流程');
                return false;
            }
            
        } catch (error) {
            console.error('❌ 儲存到後端失敗:', error);
            return false;
        }
    }
    
    // 取得用戶資料
    async function getProfile() {
        try {
            showStatus('取得用戶資料中...', 'info');
            
            const profile = await liff.getProfile();
            console.log('✅ 用戶資料:', profile);
            
            // 儲存當前用戶 ID
            currentUserId = profile.userId;
            
            // 📝 準備用戶資料
            const userData = {
                userId: profile.userId,
                displayName: profile.displayName,
                pictureUrl: profile.pictureUrl || '',
                statusMessage: profile.statusMessage || '',
                loginTime: Date.now()
            };
            
            // 💾 儲存到 localStorage
            localStorage.setItem('lineUserId', userData.userId);
            localStorage.setItem('lineDisplayName', userData.displayName);
            localStorage.setItem('linePictureUrl', userData.pictureUrl);
            localStorage.setItem('lineStatusMessage', userData.statusMessage);
            localStorage.setItem('lineLoginTime', userData.loginTime);
            
            // 💾 同時儲存到 sessionStorage
            sessionStorage.setItem('lineUserId', userData.userId);
            sessionStorage.setItem('lineDisplayName', userData.displayName);
            sessionStorage.setItem('linePictureUrl', userData.pictureUrl);
            sessionStorage.setItem('justLoggedIn', 'true');
            
            console.log('✅ 本地資料已儲存');
            
            // 🌐 儲存到後端 Google Sheets
            showStatus('同步資料到伺服器...', 'info');
            await saveUserToBackend(profile);
            
            // 🔍 檢查資料完整度
            showStatus('檢查資料完整度...', 'info');
            const checkResult = await checkProfileComplete(userData.userId);
            
            if (checkResult.success && checkResult.complete) {
                // ✅ 資料完整，直接進入遊戲
                console.log('✅ 資料完整，直接進入遊戲');
                showStatus(`歡迎回來，${profile.displayName}！`, 'success');
                loginBtn.textContent = '✅ 登入成功';
                
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                console.log('🎮 跳轉到遊戲...');
                window.location.href = 'index.html';
                
            } else {
                // ❌ 資料不完整，顯示表單
                console.log('📝 資料不完整，需要補充');
                showStatus('請補充個人資料', 'info');
                showProfileForm(profile.displayName);
            }
            
        } catch (error) {
            console.error('❌ 取得資料失敗:', error);
            showStatus('取得資料失敗，請重試', 'error');
            loginBtn.textContent = '🔄 重新登入';
            loginBtn.disabled = false;
            loginBtn.onclick = () => location.reload();
        }
    }
    
    // 頁面載入時初始化
    window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
