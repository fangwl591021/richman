<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店家管理後台｜v4.8 (GitHub 穩定版)</title>
    <!-- 版本號：v4.8 - 修正 JSON 解析錯誤與 GitHub 部署優化 -->
    <style>
        /* [核心樣式] */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft JhengHei', sans-serif; background: #f5f6fa; color: #333; line-height: 1.6; }
        .header { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 30px 20px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        
        /* 導航標籤 */
        .tabs { display: flex; gap: 10px; margin-bottom: 25px; background: #fff; padding: 8px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); overflow-x: auto; }
        .tab-button { padding: 12px 24px; border: none; background: transparent; border-radius: 8px; cursor: pointer; font-weight: bold; color: #666; transition: all 0.3s; white-space: nowrap; flex: 1; }
        .tab-button.active { background: #667eea; color: white; box-shadow: 0 4px 10px rgba(102,126,234,0.3); }
        
        .tab-content { display: none; animation: fadeIn 0.3s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 表格與卡片 */
        .card { background: white; border-radius: 15px; padding: 25px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .table-container { overflow-x: auto; margin-top: 15px; border-radius: 10px; border: 1px solid #eee; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 16px; text-align: left; border-bottom: 1px solid #f8f8f8; }
        th { background: #fbfbfb; color: #888; font-size: 13px; }
        
        /* 狀態與按鈕 */
        .btn { padding: 10px 18px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 13px; transition: all 0.2s; }
        .btn-success { background: #22c55e; color: white; }
        .btn-danger { background: #ff4d4d; color: white; }
        .badge { background: #ff4d4d; color: white; padding: 2px 8px; border-radius: 10px; font-size: 11px; margin-left: 5px; }
        
        /* 錯誤顯示與日誌 */
        .error-box { background: #fff5f5; border: 1px solid #feb2b2; color: #c53030; padding: 18px; border-radius: 12px; margin-bottom: 20px; font-size: 14px; display: none; }
        #debugLog { white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow-y: auto; font-family: 'Consolas', monospace; font-size: 11px; background: #1a202c; color: #cbd5e0; padding: 15px; border-radius: 10px; margin-top: 15px; border-left: 4px solid #ff4d4d; }
        
        .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.7); z-index: 2000; align-items: center; justify-content: center; font-weight: bold; }
    </style>
</head>
<body>
    <div id="loadingOverlay" class="loading-overlay">⚙️ 正在處理請求...</div>

    <div class="header">
        <h1>🏪 店家管理後台</h1>
        <p>版本：v4.8 | GitHub Pages 託管版</p>
    </div>

    <div class="container">
        <!-- 錯誤訊息區 -->
        <div id="errorDisplay" class="error-box"></div>

        <div class="tabs">
            <button class="tab-button active" onclick="switchTab('overview', this)">📊 系統狀態</button>
            <button class="tab-button" onclick="switchTab('approvals', this)">📝 審核申請 <span id="pendingBadge" class="badge" style="display:none">0</span></button>
            <button class="tab-button" onclick="switchTab('shops', this)">🏪 店家管理</button>
        </div>

        <!-- 總覽 -->
        <div id="overview" class="tab-content active">
            <div class="card">
                <h3>📡 通訊狀態</h3>
                <div style="margin: 15px 0;">
                    <p id="connStatus" style="font-weight:bold; color: #667eea;">正在初始化...</p>
                    <p style="font-size: 12px; color: #888; margin-top: 5px;">API 終端: https://richman.fangwl591021.workers.dev/</p>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="btn" style="background:#667eea; color:white" onclick="loadShops()">🔄 重新整理</button>
                    <button class="btn" style="background:#f0f0f0; color:#666" onclick="toggleDebug()">🐞 查看回應日誌</button>
                </div>
                <div id="debugLog" style="display:none">尚未有連線記錄</div>
            </div>
        </div>

        <!-- 核准 -->
        <div id="approvals" class="tab-content">
            <div class="card">
                <h3>待審核進駐申請</h3>
                <div class="table-container">
                    <table>
                        <thead><tr><th>名稱</th><th>分類</th><th>優惠內容</th><th>操作</th></tr></thead>
                        <tbody id="approvalsTableBody">
                            <tr><td colspan="4" style="text-align:center; padding:30px; color:#999">載入中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 管理 -->
        <div id="shops" class="tab-content">
            <div class="card">
                <h3>已上架清單</h3>
                <div class="table-container">
                    <table>
                        <thead><tr><th>圖標</th><th>名稱</th><th>優惠</th><th>狀態</th><th>操作</th></tr></thead>
                        <tbody id="shopsTableBody">
                            <tr><td colspan="5" style="text-align:center; padding:30px; color:#999">載入中...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = { API_URL: 'https://richman.fangwl591021.workers.dev/'.trim() };
        let shops = [];

        function logDebug(msg, isRaw = false) {
            const log = document.getElementById('debugLog');
            const timestamp = new Date().toLocaleTimeString();
            if (log.innerText === '尚未有連線記錄') log.innerText = '';
            const content = isRaw ? `\n--- [RAW RESPONSE] ---\n${msg}\n` : `\n[${timestamp}] ${msg}`;
            log.innerText += content;
            log.scrollTop = log.scrollHeight;
        }

        function toggleDebug() {
            const log = document.getElementById('debugLog');
            log.style.display = (log.style.display === 'none') ? 'block' : 'none';
        }

        function showError(title, detail) {
            const el = document.getElementById('errorDisplay');
            el.innerHTML = `<strong>⚠️ ${title}</strong><br><small>${detail}</small>`;
            el.style.display = 'block';
            logDebug(`ERROR: ${title} - ${detail}`);
        }

        /**
         * 🚀 核心通訊機制 v4.8
         */
        async function runAction(action, params = {}, method = 'GET') {
            document.getElementById('loadingOverlay').style.display = 'flex';
            document.getElementById('errorDisplay').style.display = 'none';
            
            const urlParams = new URLSearchParams();
            urlParams.append('action', action);
            for (const key in params) { urlParams.append(key, params[key]); }

            let fetchUrl = CONFIG.API_URL;
            const fetchOptions = { method, mode: 'cors', cache: 'no-cache' };

            if (method === 'GET') {
                fetchUrl += (fetchUrl.includes('?') ? '&' : '?') + urlParams.toString();
            } else {
                fetchOptions.body = urlParams;
                fetchOptions.headers = { 'Content-Type': 'application/x-www-form-urlencoded' };
            }

            try {
                logDebug(`發送請求: ${action}`);
                const response = await fetch(fetchUrl, fetchOptions);
                const responseText = await response.text();

                // 🎯 重要：檢查是否回傳了 HTML (代表 GAS 噴錯或需要登入)
                if (responseText.trim().startsWith('<!doctype') || responseText.includes('<html')) {
                    logDebug(responseText, true);
                    throw new Error("後端回傳了 HTML 報錯頁面。請檢查 GAS 部署權限是否為「任何人」。");
                }

                const data = JSON.parse(responseText);
                document.getElementById('loadingOverlay').style.display = 'none';
                return data;
            } catch (e) {
                document.getElementById('loadingOverlay').style.display = 'none';
                showError("通訊失敗", e.message);
                return { success: false, message: e.message };
            }
        }

        window.onload = function() {
            document.getElementById('connStatus').innerText = "🌐 已連線至代理伺服器，準備載入資料...";
            loadShops();
        };

        async function loadShops() {
            const res = await runAction('getAllShops');
            if (res && res.success) {
                shops = res.data || [];
                renderUI();
                logDebug(`成功載入 ${shops.length} 筆店家`);
            }
        }

        function renderUI() {
            // 渲染正式店家
            const active = shops.filter(s => s.status !== '待核准');
            document.getElementById('shopsTableBody').innerHTML = active.length ? active.map(s => `
                <tr>
                    <td style="font-size:24px">${s.icon || '🏪'}</td>
                    <td><strong>${s.name}</strong></td>
                    <td>${s.discount || '無'}</td>
                    <td><span style="font-size:12px; padding:3px 8px; background:#edf2f7; border-radius:10px">${s.status}</span></td>
                    <td><button class="btn btn-danger" style="padding:4px 8px" onclick="deleteShop('${s.id}')">刪除</button></td>
                </tr>
            `).join('') : '<tr><td colspan="5" style="text-align:center; padding:20px; color:#999">目前沒有上架店家</td></tr>';

            // 渲染審核案件
            const pending = shops.filter(s => s.status === '待核准');
            document.getElementById('pendingBadge').style.display = pending.length ? 'inline' : 'none';
            document.getElementById('pendingBadge').innerText = pending.length;
            
            document.getElementById('approvalsTableBody').innerHTML = pending.length ? pending.map(s => `
                <tr>
                    <td><strong>${s.name}</strong></td>
                    <td>${s.category}</td>
                    <td style="color:#e63946; font-weight:bold">${s.discount}</td>
                    <td><button class="btn btn-success" onclick="approveShop('${s.id}')">✅ 核准上架</button></td>
                </tr>
            `).join('') : '<tr><td colspan="4" style="text-align:center; padding:20px; color:#999">無待處理申請</td></tr>';
        }

        async function approveShop(id) {
            const res = await runAction('updateShopStatus', { shopId: id, status: '啟用' }, 'POST');
            if (res && res.success) loadShops();
        }

        async function deleteShop(id) {
            if (!confirm("確定要刪除或拒絕此店家嗎？")) return;
            const res = await runAction('deleteShop', { shopId: id }, 'POST');
            if (res && res.success) loadShops();
        }

        function switchTab(name, btn) {
            document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            document.getElementById(name).classList.add('active');
        }
    </script>
</body>
</html>
